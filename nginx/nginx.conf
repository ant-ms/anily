server {
    listen 80;
    server_name _;

    root /downloads;
    autoindex off;

    add_header Accept-Ranges bytes;

    location / {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        add_header Cache-Control "no-cache";
        add_header Accept-Ranges bytes;
        # Try direct file, or index inside directory, or common video extensions
        try_files $uri $uri/index.mkv $uri/index.mp4 =404;
    }

    location ~ /\. {
        deny all;
    }
}
