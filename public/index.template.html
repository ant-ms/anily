<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{APP_NAME}}</title>
  <meta name="version" content="{{APP_VERSION}}-{{COMMIT_SHA}}">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .card {
      width: 100%;
      max-width: 340px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      margin: 0 auto;
      display: block;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
    }
    .version {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-top: -0.25rem;
      margin-bottom: 0.5rem;
    }
    .btn {
      display: block;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.95rem;
      box-sizing: border-box;
      transition: opacity 0.15s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-obtainium {
      background: #10b981;
      color: #ffffff;
    }
    .btn-download {
      background: #3b82f6;
      color: #ffffff;
    }
    .btn-secondary {
      background: #1f2937;
      color: #9ca3af;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="icon.png" alt="{{APP_NAME}}" class="icon" onerror="this.style.display='none'">
    <h1>{{APP_NAME}}</h1>
    <div class="version">v{{APP_VERSION}} ({{COMMIT_SHA}})</div>

    <a id="obtainium-direct-btn" href="{{STATIC_OBTAINIUM_DIRECT}}" class="btn btn-obtainium">Add to Obtainium</a>
    <a id="download-apk-link" href="{{APK_FILENAME}}" class="btn btn-download">Download APK</a>
    <a id="obtainium-redirect-btn" href="{{STATIC_OBTAINIUM_REDIRECT}}" class="btn btn-secondary">Add via Obtainium Web Redirect</a>
  </div>

  <script>
    (function() {
      try {
        var pageUrl = window.location.href.split('?')[0].split('#')[0];
        if (!pageUrl.endsWith('/')) pageUrl += '/';

        var config = {
          id: "{{APP_ID}}",
          url: pageUrl,
          author: "ant.ms",
          name: "{{APP_NAME}}",
          additionalSettings: JSON.stringify({
            versionExtractionRegEx: "{{APP_NAME_LOWER}}-([^/]+)\\.apk",
            matchGroupToUse: "1",
            apkFilterRegEx: "{{APP_NAME_LOWER}}-.+\\.apk"
          })
        };

        var direct = "obtainium://app/" + encodeURIComponent(JSON.stringify(config));
        var btn = document.getElementById('obtainium-direct-btn');
        if (btn) btn.href = direct;

        var rBtn = document.getElementById('obtainium-redirect-btn');
        if (rBtn) rBtn.href = "https://apps.obtainium.imranr.dev/redirect?r=" + encodeURIComponent(direct);
      } catch (e) {}
    })();
  </script>
</body>
</html>
